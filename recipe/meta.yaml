{% set version = "12.4.0" %}
{% set python_min = "3.11.0" %}
package:
  name: testfixtures
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/t/testfixtures/testfixtures-{{ version }}.tar.gz
  sha256: cc0108614f88ace8817b587bea06615bdd225fec392ed3de8afabff5d1ef21c7

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python {{ python_min }}
    - pip
    - hatchling
  run:
    - python >={{ python_min }}

test:
  requires:
    - python {{ python_min }}
  imports:
    - testfixtures

about:
  home: https://testfixtures.readthedocs.io
  license: MIT
  license_file: LICENSE.txt
  summary: A collection of helpers and mock objects for unit tests and doc tests.
  doc_url: https://testfixtures.readthedocs.io
  dev_url: https://github.com/Simplistix/testfixtures

extra:
  recipe-maintainers:
    - ChrisBarker-NOAA
    - JamesMakela-NOAA
    - cjw296
